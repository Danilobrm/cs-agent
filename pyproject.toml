[project]
name = "cs-agent"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "danilobrm", email = "danilobr.web@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.42.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
cs-agent = "cs_agent:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pypdf>=6.21.4",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
